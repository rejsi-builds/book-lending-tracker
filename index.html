<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lending Tracker</title>
    <link rel="stylesheet" href="library.css">
</head>

<body>

    <header class="header">
        <h1>Book Lending Tracker</h1>
        <p>Keep track of the books you lent, to whom, and when they are due.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2 class="card-title">Lend a book</h2>
            <form id="lend-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="title">Title</label>
                    <input class="form-control" type="text" id="title" name="title" required>
                    <span class="form-error" id="title-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="author">Author</label>
                    <input class="form-control" type="text" id="author" name="author" required>
                    <span class="form-error" id="author-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="borrower">Borrower</label>
                    <input class="form-control" type="text" id="borrower" name="borrower" required>
                    <span class="form-error" id="borrower-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="due-date">Due date</label>
                    <input class="form-control" type="date" id="due-date" name="due-date" required>
                    <span class="form-error" id="due-date-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="genre">Genre</label>
                    <select class="form-control" id="genre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Science">Science</option>
                        <option value="History">History</option>
                        <option value="Technology">Technology</option>
                    </select>
                    <span class="form-error" id="genre-error"></span>
                </div>

                <button type="submit" class="btn btn-primary">Add loan</button>
            </form>
        </section>

        <section class="card">
            <h2 class="card-title">Lent books</h2>

            <div class="stats" id="summary">
                <div class="stat">
                    <span class="stat-label">Total loans</span>
                    <span class="stat-value" id="total-loans">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Overdue loans</span>
                    <span class="stat-value text-danger" id="overdue-loans">0</span>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Borrower</th>
                            <th>Due date</th>
                            <th>Genre</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="loan-list"></tbody>
                </table>
            </div>

            <p class="text-center text-muted" id="empty-message">No books lent yet.</p>
        </section>

    </main>

    <footer class="footer text-center text-muted">
        <p>Book Lending Tracker &copy; 2026</p>
    </footer>

    <script src="library.js"></script>
    <script src="app.js"></script>
</body>

</html>
