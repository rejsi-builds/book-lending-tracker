<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lending Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <h1>Book Lending Tracker</h1>
        <p>Keep track of the books you lent, to whom, and when they are due.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Lend a book</h2>

            <form id="lend-form">

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>

                <div class="form-group">
                    <label for="borrower">Borrower</label>
                    <input type="text" id="borrower" name="borrower" required>
                </div>

                <div class="form-group">
                    <label for="due-date">Due date</label>
                    <input type="date" id="due-date" name="due-date" required>
                </div>

                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Science">Science</option>
                        <option value="History">History</option>
                        <option value="Technology">Technology</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Add loan</button>
            </form>
        </section>

    </main>

    <footer class="site-footer">
        <p>Book Lending Tracker &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
