<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lending Tracker</title>
    <link rel="stylesheet" href="library.css">
</head>

<body>

    <header class="site-header">
        <h1>Book Lending Tracker</h1>
        <p>Keep track of the books you lent, to whom, and when they are due.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Lend a book</h2>

            <form id="lend-form" novalidate>

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                    <span class="error" id="title-error"></span>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                    <span class="error" id="author-error"></span>
                </div>

                <div class="form-group">
                    <label for="borrower">Borrower</label>
                    <input type="text" id="borrower" name="borrower" required>
                    <span class="error" id="borrower-error"></span>
                </div>

                <div class="form-group">
                    <label for="due-date">Due date</label>
                    <input type="date" id="due-date" name="due-date" required>
                    <span class="error" id="due-date-error"></span>
                </div>

                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" name="genre" required>
                        <option value="">Select a genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Science">Science</option>
                        <option value="History">History</option>
                        <option value="Technology">Technology</option>
                    </select>
                    <span class="error" id="genre-error"></span>
                </div>

                <button type="submit" class="btn btn-primary">Add loan</button>
            </form>
        </section>

        <section class="card">
            <h2>Lent books</h2>

            <div class="summary" id="summary">
                <div class="summary-box">
                    <span class="summary-label">Total loans</span>
                    <span class="summary-value" id="total-loans">0</span>
                </div>
                <div class="summary-box">
                    <span class="summary-label">Overdue loans</span>
                    <span class="summary-value summary-overdue" id="overdue-loans">0</span>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Borrower</th>
                            <th>Due date</th>
                            <th>Genre</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="loan-list"></tbody>
                </table>
            </div>

            <p class="empty-message" id="empty-message">No books lent yet.</p>
        </section>

    </main>

    <footer class="site-footer">
        <p>Book Lending Tracker &copy; 2026</p>
    </footer>

    <script src="library.js"></script>
    <script src="app.js"></script>
</body>

</html>
